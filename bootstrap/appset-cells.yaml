  template:
    metadata:
      name: '{{cell}}'
      labels:
        con339.io/ring: fleet
    spec:
      project: default
      destination:
        server: '{{server}}'
        namespace: '{{namespace}}'
      source:
        repoURL: https://github.com/lusoal/con339-workloads-44fcc4
        targetRevision: main
        path: overlays/cells/{{cell}}
      # Reconciliation is ON for the whole hour, and that is a change from the
      # two-act version of this demo.
      #
      # Every break is a commit now. The room picks a change, confirms it, and one
      # press ships one commit per change, so Argo CD is what DELIVERS the faults --
      # with no automated block nothing would deploy and the room would press Break
      # to no effect at all.
      #
      # It also makes the decoys safe. The old design had the room breaking cells by
      # hand, and any new revision on main made Argo CD re-apply every manifest, so a
      # decoy commit silently restored the damage. It happened twice in rehearsal and
      # looked exactly like self-heal while selfHeal was off. Now a decoy-triggered
      # sync re-applies the same broken Git state, so the damage is held in place by
      # the very thing that caused it.
      #
      # selfHeal:true earns its place separately: the attendee terminals still have
      # edit rights, so anyone changing their cell by hand watches Argo CD put it back
      # within about five seconds. That is the GitOps lesson, live, for free.
      #
      # The fix is a human merging one pull request. Nothing on the presenter page
      # heals the fleet, because nothing needs to.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
