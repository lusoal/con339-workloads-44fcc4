# Rename the app selector label.
#
# Repoints the Service selector at app=con339-web. No pod carries that label,
# so the Service has no endpoints and nothing can reach the app.
#
# Reads as a tidy-up: con339-web is a plausible name for the thing the Service
# fronts. The Service and the Deployment are both individually valid and only
# disagree with each other.
#
# Signature: same as release-service-port. replicas_unavailable OK, the other
# two ALARM. `kubectl get endpoints con339-app` is the fastest way to tell the
# two apart -- empty here, populated but wrong there.
apiVersion: v1
kind: Service
metadata:
  name: con339-app
  namespace: con339
spec:
  selector:
    app: con339-web
