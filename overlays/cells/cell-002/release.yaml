# Break 1: a fixed fault, not on the ballot. Points the app at an image tag that
# does not exist, producing ImagePullBackOff on one cluster. Deliberately unlike
# releases A, B and C so it gives nothing away about the vote.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: con339-app
  namespace: con339
spec:
  template:
    spec:
      containers:
        - name: app
          image: python:3.12-alpine-does-not-exist
