apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: con339-ns-01
resources:
  - ../../../base
labels:
  - pairs:
      con339.io/cell: cell-017
      con339.io/cluster: use1-05
patches:
  # The release slot. At show-start this is a no-op patch. A fault release
  # replaces this one file, and the fix restores it. It is the only file a
  # break or a fix ever touches.
  - path: release.yaml
