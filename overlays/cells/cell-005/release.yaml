# Right-size CPU requests.
#
# Raises the CPU request far above what any allowed instance can provide and
# raises the HPA replica floor at the same time, so replicas are demanded
# immediately and every new pod stays Pending with no node able to fit it.
#
# The HPA change matters: without it the existing pods keep running and the
# fault is invisible until something restarts them.
#
# Signature: pods NOT Running (Pending, insufficient cpu). All three ALARM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: con339-app
  namespace: con339
spec:
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: "95"
            limits:
              cpu: "95"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: con339-app
  namespace: con339
spec:
  minReplicas: 5
