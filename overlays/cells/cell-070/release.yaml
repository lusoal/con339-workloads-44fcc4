# Standardise the service port.
#
# Moves the Service's targetPort to 9999. The app still listens on 8080, so the
# Service forwards every request to a port nothing is listening on.
#
# This is the quiet one, and the reason it is in the set. Every pod is Running
# and Ready, the Deployment reports its full replica count, `kubectl get pods`
# is immaculate, and the cell is completely down. An investigation that only
# looks at workloads reports that nothing is wrong.
#
# The patch merges by port number -- spec.ports has patchMergeKey "port" -- so
# naming port 80 replaces that entry's targetPort and leaves the rest alone.
#
# Signature: replicas_unavailable stays OK. HttpHealthy and DnsSuccess go
# ALARM. That OK in the first column is the whole tell.
apiVersion: v1
kind: Service
metadata:
  name: con339-app
  namespace: con339
spec:
  ports:
    - port: 80
      targetPort: 9999
