# Release B: DNS. Narrows the base allow-all egress NetworkPolicy to TCP 80 and
# 443 only, so UDP and TCP port 53 are blocked. DNS lookups fail, the /ready
# probe returns 500, and the pods go unready. DnsSuccess drops to 0.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: con339-egress
  namespace: con339
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
