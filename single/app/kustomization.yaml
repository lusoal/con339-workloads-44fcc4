apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The same base as every cell, so the app, the Service, the probe endpoints and
# therefore the three alarm signatures are identical to the fleet's. An agent that
# has learned to read them here reads them the same way there.
namespace: con339
resources:
  - ../../base
labels:
  - pairs:
      con339.io/env: single
