apiVersion: v1
kind: ConfigMap
metadata:
  name: con339-loadgen
  namespace: con339
data:
  loadgen.py: |
    # 3-minute sawtooth: request rate ramps from 1 to 30 req/s, then drops.
    import threading
    import time
    import urllib.request

    # Bare service name on purpose. The pod's search domains resolve it inside
    # whichever namespace this cell lands in, so one base works for every cell.
    # A fully qualified name would pin every cell's loadgen at one namespace.
    URL = "http://con339-app/healthz"
    PERIOD = 180


    def hit():
        try:
            urllib.request.urlopen(URL, timeout=2).read()
        except Exception:
            pass


    while True:
        rate = 1 + int((time.time() % PERIOD) / PERIOD * 29)
        for _ in range(rate):
            threading.Thread(target=hit, daemon=True).start()
        time.sleep(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: con339-loadgen
  namespace: con339
  labels:
    app: con339-loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: con339-loadgen
  template:
    metadata:
      labels:
        app: con339-loadgen
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        con339.io/pool: app-pool
      containers:
        - name: loadgen
          image: python:3.12-alpine
          command: ["python", "-u", "/app/loadgen.py"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: con339-loadgen
