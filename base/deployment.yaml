apiVersion: apps/v1
kind: Deployment
metadata:
  name: con339-app
  namespace: con339
  labels:
    app: con339-app
spec:
  replicas: 2
  strategy:
    type: Recreate
  progressDeadlineSeconds: 60
  # The rollout, not Argo CD, was the slow part of a break: Argo CD applies the
  # manifest in a few seconds and then Kubernetes spends tens of seconds shutting
  # pods down gracefully. Nothing here holds state, so graceful shutdown buys
  # nothing and costs the demo its pacing.
  minReadySeconds: 0
  selector:
    matchLabels:
      app: con339-app
  template:
    metadata:
      labels:
        app: con339-app
    spec:
      # Nothing here holds state, so a graceful shutdown window only delays the
      # break. The default 30s was the single biggest contributor to "it takes a
      # while to truly break".
      terminationGracePeriodSeconds: 0
      nodeSelector:
        con339.io/pool: app-pool
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
          env:
            - name: DNS_TARGET
              value: sts.us-east-1.amazonaws.com
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            # One second, one failure. A broken pod used to stay "ready" for up
            # to ten seconds after it had actually stopped working, which the
            # probe then could not see either.
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 1
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: con339-app
