apiVersion: v1
kind: ConfigMap
metadata:
  name: con339-release
  namespace: con339
data:
  release: baseline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: con339-app
  namespace: con339
data:
  app.py: |
    import concurrent.futures
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DNS_TARGET = os.environ.get("DNS_TARGET", "sts.us-east-1.amazonaws.com")
    POOL = concurrent.futures.ThreadPoolExecutor(max_workers=8)


    def resolve():
        try:
            fut = POOL.submit(socket.getaddrinfo, DNS_TARGET, 443)
            fut.result(timeout=3)
            return True
        except Exception:
            return False


    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            data = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, "ok\n")
            elif self.path in ("/dns", "/ready"):
                if resolve():
                    self._send(200, "dns ok\n")
                else:
                    self._send(500, "dns failed\n")
            else:
                self._send(404, "not found\n")

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
